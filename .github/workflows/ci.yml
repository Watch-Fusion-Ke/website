name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_WIX_CLIENT_ID: ${{ vars.NEXT_PUBLIC_WIX_CLIENT_ID }}
          FEATURED_PRODUCTS_CATEGORY_ID: ${{ vars.FEATURED_PRODUCTS_CATEGORY_ID }}
